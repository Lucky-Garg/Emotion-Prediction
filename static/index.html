<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emotion Lens — Text Emotion Prediction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="aura" id="aura"></div>
<div class="noise"></div>

<div class="shell">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8.5 10.2c.3-.7.9-1.1 1.5-1.1s1.2.4 1.5 1.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12.5 10.2c.3-.7.9-1.1 1.5-1.1s1.2.4 1.5 1.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M8.3 14.5c1 1.3 2.3 2 3.7 2s2.7-.7 3.7-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Emotion Lens</h1>
        <p>type something — see what it's carrying</p>
      </div>
    </div>
    <div class="status-pill" id="statusPill">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking model…</span>
    </div>
  </header>

  <main class="stage">

    <section class="input-panel">
      <label for="textInput" class="input-label">Your sentence</label>
      <div class="input-wrap">
        <textarea id="textInput" maxlength="2000" placeholder="e.g. I can't believe how excited I am for this trip…" rows="4"></textarea>
        <div class="input-foot">
          <span class="char-count" id="charCount">0 / 2000</span>
          <button class="predict-btn" id="predictBtn">
            <span id="btnLabel">Analyze</span>
            <svg id="btnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
          </button>
        </div>
      </div>
      <p class="error-msg" id="errorMsg" style="display:none"></p>

      <div class="examples" id="examples">
        <span class="examples-label">Try:</span>
        <button class="chip" data-text="I don't know why but I've been feeling so low all week.">low all week</button>
        <button class="chip" data-text="Wait, seriously? I did not see that coming at all.">plot twist</button>
        <button class="chip" data-text="Please don't leave me alone in this house tonight.">home alone</button>
      </div>
    </section>

    <section class="result-panel" id="resultPanel">
      <div class="result-empty" id="resultEmpty">
        <div class="empty-orb"></div>
        <p>Your result will show up here</p>
      </div>

      <div class="result-content" id="resultContent" style="display:none">
        <div class="result-hero">
          <div class="emoji-badge" id="emojiBadge">😐</div>
          <div class="hero-text">
            <p class="hero-label">Top emotion</p>
            <h2 id="emotionName">—</h2>
            <p class="hero-quote" id="echoText"></p>
          </div>
          <div class="confidence-ring">
            <svg width="72" height="72" viewBox="0 0 72 72">
              <circle cx="36" cy="36" r="30" fill="none" stroke="var(--ring-track)" stroke-width="6"/>
              <circle id="ringProgress" cx="36" cy="36" r="30" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90 36 36)"/>
            </svg>
            <span id="confidenceValue">0%</span>
          </div>
        </div>

        <div class="prob-list" id="probList"></div>
      </div>
    </section>

  </main>

  <footer class="foot">
    <span>Powered by a BiGRU model</span>
  </footer>
</div>

<script src="/static/script.js"></script>
</body>
</html>
